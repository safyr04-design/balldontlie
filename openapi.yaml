tags:
  - name: Factors
    description: Pre-built factors for building prediction models
  - name: Models
    description: User-created betting prediction models
  - name: Predictions
    description: Model predictions for games
  - name: Performance
    description: Model performance evaluation
  - name: Jobs
    description: Background job status

paths:
  # ============================================
  # Factor Endpoints
  # ============================================
  /lab/v1/factors:
    get:
      operationId: listFactors
      summary: List all factors
      description: |
        Returns all available factors for building prediction models.
        Factors are pre-built analytical components that can be combined to create models.
      tags:
        - Factors
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by factor category (team_performance, matchup, situational, player, market)
        - name: sport
          in: query
          schema:
            $ref: "#/components/schemas/Sport"
          description: Filter by sport (default nba)
      responses:
        "200":
          description: List of factors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Factor"
              examples:
                factorList:
                  $ref: "#/components/examples/FactorListResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/factors/{id}:
    get:
      operationId: getFactor
      summary: Get a factor
      description: Returns details of a specific factor.
      tags:
        - Factors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Factor ID
      responses:
        "200":
          description: Factor details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Factor"
              examples:
                teamPerformanceFactor:
                  $ref: "#/components/examples/FactorTeamPerformance"
                matchupFactor:
                  $ref: "#/components/examples/FactorMatchup"
                situationalFactor:
                  $ref: "#/components/examples/FactorSituational"
        "400":
          description: Invalid factor ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Factor not found

  # ============================================
  # Model Endpoints
  # ============================================
  /lab/v1/models:
    get:
      operationId: listModels
      summary: List user's models
      description: Returns all models owned by the authenticated user.
      tags:
        - Models
      parameters:
        - name: sport
          in: query
          schema:
            type: string
          description: Filter by sport
        - name: bet_type
          in: query
          schema:
            type: string
          description: Filter by bet type
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of results per page
        - name: cursor
          in: query
          schema:
            type: integer
          description: Cursor for pagination
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
                  meta:
                    $ref: "#/components/schemas/CursorPagination"
              examples:
                modelList:
                  $ref: "#/components/examples/ModelListResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: createModel
      summary: Create a model
      description: |
        Creates a new prediction model.

        For weighted mode, factor weights must sum to 100.
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
            examples:
              simpleMode:
                $ref: "#/components/examples/CreateModelSimpleRequest"
              weightedMode:
                $ref: "#/components/examples/CreateModelWeightedRequest"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Model"
              examples:
                simpleModel:
                  $ref: "#/components/examples/ModelSimpleMode"
                weightedModel:
                  $ref: "#/components/examples/ModelWeightedMode"
        "400":
          description: Invalid request body or weights don't sum to 100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                weightValidation:
                  $ref: "#/components/examples/WeightValidationError"

  /lab/v1/models/{id}:
    get:
      operationId: getModel
      summary: Get a model
      description: Returns details of a specific model owned by the user.
      tags:
        - Models
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Model"
              examples:
                model:
                  $ref: "#/components/examples/ModelSimpleMode"
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found

    put:
      operationId: updateModel
      summary: Update a model
      description: |
        Updates an existing model.

        For weighted mode, factor weights must sum to 100.

        **Note:** Editing factors, mode, bet_type, or advanced_config clears any existing performance data.
      tags:
        - Models
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Model"
              examples:
                model:
                  $ref: "#/components/examples/ModelSimpleMode"
        "400":
          description: Invalid request body or weights don't sum to 100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found

    delete:
      operationId: deleteModel
      summary: Delete a model
      description: Deletes a model and all associated data (predictions, performance, jobs).
      tags:
        - Models
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "204":
          description: Model deleted
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found

  # ============================================
  # Prediction Endpoints
  # ============================================
  /lab/v1/predictions:
    get:
      operationId: listPredictions
      summary: List predictions for a model
      description: Returns predictions for a specific model with game details.
      tags:
        - Predictions
      parameters:
        - name: model_id
          in: query
          required: true
          schema:
            type: integer
          description: Model ID (required)
        - name: result
          in: query
          schema:
            type: string
          description: Filter by result (win, loss, push)
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Filter by start date (ISO8601)
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: Filter by end date (ISO8601)
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of results per page
        - name: cursor
          in: query
          schema:
            type: integer
          description: Cursor for pagination
      responses:
        "200":
          description: List of predictions with game details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PredictionWithGame"
                  meta:
                    $ref: "#/components/schemas/CursorPagination"
              examples:
                empty:
                  $ref: "#/components/examples/PredictionListEmpty"
                withGames:
                  $ref: "#/components/examples/PredictionsListWithGames"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/predictions/stats:
    get:
      operationId: getPredictionStats
      summary: Get prediction statistics
      description: Returns aggregate statistics for a model's predictions.
      tags:
        - Predictions
      parameters:
        - name: model_id
          in: query
          required: true
          schema:
            type: integer
          description: Model ID (required)
      responses:
        "200":
          description: Prediction statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PredictionStats"
              examples:
                stats:
                  $ref: "#/components/examples/PredictionStats"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/predictions/{id}:
    get:
      operationId: getPrediction
      summary: Get a prediction
      description: Returns details of a specific prediction.
      tags:
        - Predictions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Prediction ID
      responses:
        "200":
          description: Prediction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Prediction"
              examples:
                prediction:
                  $ref: "#/components/examples/PredictionResponse"
        "400":
          description: Invalid prediction ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Prediction not found

  /lab/v1/models/{id}/predictions/generate:
    post:
      operationId: generatePredictions
      summary: Generate predictions
      description: |
        Creates a background job to generate predictions for upcoming games.
        Poll the job endpoint to get results.

        **Note:** Only one prediction generation job can run per model at a time. If a pending
        or running job already exists, a 409 Conflict is returned.
      tags:
        - Predictions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
              examples:
                jobCreated:
                  $ref: "#/components/examples/GeneratePredictionsJobCreated"
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Prediction generation already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyRunning:
                  summary: Active job exists
                  value:
                    error: Predictions are already being generated
                    active_job_id: "81cea460-5e30-4f15-9e0d-9493541a3c7d"

  # ============================================
  # Performance Endpoints
  # ============================================
  /lab/v1/performance/preview:
    post:
      operationId: createPreview
      summary: Create preview job
      description: |
        Creates a background job to preview model performance without saving.
        Returns historical performance and predictions for upcoming games.
        Poll the job endpoint to get results.
      tags:
        - Performance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              preview:
                $ref: "#/components/examples/CreatePreviewRequest"
      responses:
        "201":
          description: Preview job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
              examples:
                previewJob:
                  $ref: "#/components/examples/PreviewJobCreated"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/models/{id}/performance:
    get:
      operationId: getModelPerformance
      summary: Get model performance
      description: |
        Returns performance evaluation results for a model.
        Returns null if evaluation has not been run yet.
      tags:
        - Performance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "200":
          description: Performance results (null if not evaluated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/ModelPerformance"
                      - type: "null"
              examples:
                notEvaluated:
                  $ref: "#/components/examples/PerformanceNotEvaluated"
                running:
                  $ref: "#/components/examples/PerformanceRunning"
                completed:
                  $ref: "#/components/examples/PerformanceCompleted"
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: evaluatePerformance
      summary: Trigger performance evaluation
      description: |
        Creates a background job to run performance evaluation for a model against historical data.
        Returns immediately with a job object - poll the job endpoint to get results.
        Clears any existing performance data before running.

        **Season Format:** "YYYY-YY" (e.g., "2024-25")
        **Allowed Seasons:** 2020-21 through 2025-26

        **Note:** Only one evaluation job can run per model at a time. If a pending or running
        evaluation job already exists, a 409 Conflict is returned.
      tags:
        - Performance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluatePerformanceRequest"
      responses:
        "201":
          description: Evaluation job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
              examples:
                evaluateJob:
                  summary: Evaluate job created
                  value:
                    data:
                      id: "81cea460-5e30-4f15-9e0d-9493541a3c7d"
                      model_id: 1
                      job_type: evaluate
                      status: pending
                      output: null
                      error_message: null
                      created_at: "2026-01-31T22:14:50.285Z"
                      started_at: null
                      completed_at: null
        "400":
          description: Invalid request (season format, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Evaluation already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyRunning:
                  summary: Active job exists
                  value:
                    error: A backtest is already running
                    active_job_id: "81cea460-5e30-4f15-9e0d-9493541a3c7d"

    delete:
      operationId: clearPerformance
      summary: Clear performance data
      description: Clears all performance evaluation data for a model.
      tags:
        - Performance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "204":
          description: Performance data cleared
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/models/{id}/performance/games:
    get:
      operationId: getPerformanceGames
      summary: Get per-game performance details
      description: Returns paginated per-game breakdown of performance evaluation.
      tags:
        - Performance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
        - name: result
          in: query
          schema:
            type: string
            enum: [win, loss, push, pending]
          description: Filter by result
      responses:
        "200":
          description: Per-game performance details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PerformanceGameResult"
                  meta:
                    $ref: "#/components/schemas/OffsetPagination"
              examples:
                gamesResponse:
                  $ref: "#/components/examples/PerformanceGamesResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ============================================
  # Job Endpoints
  # ============================================
  /lab/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get job status
      description: |
        Returns the status and output of a background job.
        Poll this endpoint until status is "completed" or "failed".
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Job ID (UUID)
      responses:
        "200":
          description: Job status and output
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
              examples:
                pending:
                  $ref: "#/components/examples/JobPending"
                running:
                  $ref: "#/components/examples/JobRunning"
                failed:
                  $ref: "#/components/examples/JobFailed"
                evaluateCompleted:
                  $ref: "#/components/examples/EvaluateJobCompleted"
                previewCompleted:
                  $ref: "#/components/examples/PreviewJobCompleted"
                generatePredictionsCompleted:
                  $ref: "#/components/examples/GeneratePredictionsJobCompleted"
        "400":
          description: Invalid job ID (must be valid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidUUID:
                  $ref: "#/components/examples/JobInvalidUUIDError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  $ref: "#/components/examples/JobNotFoundError"

    delete:
      operationId: cancelJob
      summary: Cancel a job
      description: |
        Cancels a pending or running job. Only jobs with status "pending" or "running" can be cancelled.
        Cancelled jobs have their status set to "cancelled" with error message "Cancelled by user".
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Job ID (UUID)
      responses:
        "200":
          description: Job cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
              examples:
                cancelled:
                  $ref: "#/components/examples/JobCancelled"
        "400":
          description: Job cannot be cancelled (already completed, failed, or cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyCancelled:
                  summary: Cannot cancel already-cancelled job
                  value:
                    error: Cannot cancel job with status "cancelled". Only pending or running jobs can be cancelled.
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lab/v1/models/{id}/jobs/active:
    get:
      operationId: getActiveJobsForModel
      summary: Get active jobs for a model
      description: |
        Returns all pending and running jobs for a specific model.
        Used to determine if a model has jobs in progress that would prevent new jobs from being created.
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Model ID
      responses:
        "200":
          description: List of active jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
              examples:
                activeJobs:
                  summary: Active jobs for model
                  value:
                    data:
                      - id: "81cea460-5e30-4f15-9e0d-9493541a3c7d"
                        model_id: 1
                        job_type: evaluate
                        status: running
                        output: null
                        error_message: null
                        created_at: "2026-01-31T22:14:50.285Z"
                        started_at: "2026-01-31T22:14:51.212Z"
                        completed_at: null
                noActiveJobs:
                  summary: No active jobs
                  value:
                    data: []
        "400":
          description: Invalid model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
