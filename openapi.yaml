openapi: 3.1.0
info:
  title: BALLDONTLIE Lab API
  version: "1.0.0"
  description: |
    Build, backtest, and deploy betting models programmatically. The Lab API gives you access to pre-built analytical factors, model creation, historical backtesting, and prediction generation across multiple sports.

    ## Quick Start

    1. **Create an account** at [lab-app.balldontlie.io](https://lab-app.balldontlie.io)
    2. **Upgrade to PRO or ALL-ACCESS** (free tiers cannot access the API)
    3. **Grab your API key** from your account settings

    ## Authentication

    All endpoints require authentication via API key in the `Authorization` header:

    ```bash
    curl "https://api.balldontlie.io/lab/v1/factors" \
      -H "Authorization: YOUR_API_KEY"
    ```

    ## Rate Limits

    | Limit | Value |
    |-------|-------|
    | Requests per minute | 100 |

    Rate limit headers are included in every response:

    | Header | Description |
    |--------|-------------|
    | `X-RateLimit-Limit` | Maximum requests per minute |
    | `X-RateLimit-Remaining` | Requests remaining in current window |
    | `X-RateLimit-Reset` | Unix timestamp when the limit resets |

    ## Supported Sports

    | Sport | Code | Status |
    |-------|------|--------|
    | NBA | `nba` | Available |
    | NFL | `nfl` | Available |
    | NHL | `nhl` | Available |
    | MLB | `mlb` | Available |

    ## Subscription Tiers

    | Tier | Backtest History | Models | API Access |
    |------|------------------|--------|------------|
    | ALL-ACCESS | 6 years | Unlimited | Full |
    | LAB PRO | 6 years | Unlimited | Full |

    Subscribe at [lab-app.balldontlie.io](https://lab-app.balldontlie.io) to get started.

  contact:
    name: BALLDONTLIE Support
    email: hello@balldontlie.io
    url: https://discord.gg/cQJhfTPn8j
  termsOfService: https://www.balldontlie.io/terms

servers:
  - url: https://api.balldontlie.io
    description: Production server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key (can be prefixed with "Bearer " or sent raw)

  schemas:
    # Common Components
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    CursorPagination:
      type: object
      properties:
        next_cursor:
          type:
            - integer
            - "null"
          description: Cursor for the next page of results
        prev_cursor:
          type:
            - integer
            - "null"
          description: Cursor for the previous page of results
        per_page:
          type: integer
          description: Number of results per page

    OffsetPagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of results
        limit:
          type: integer
          description: Number of results per page
        offset:
          type: integer
          description: Number of results skipped

    # Lab Enums
    Sport:
      type: string
      enum: [nba, nhl, nfl, mlb]
      description: Supported sports

    BetType:
      type: string
      enum: [spread, moneyline, over_under, player_prop]
      description: Type of bet the model predicts

    ModelMode:
      type: string
      enum: [simple, weighted]
      description: |
        Model calculation mode:
        - simple: Assign importance (Low/Medium/High) to each factor
        - weighted: Assign precise weights that must sum to 100%

    Importance:
      type: string
      enum: [low, medium, high]
      description: Factor importance level (used in simple mode)

    PerformanceStatus:
      type: string
      enum: [pending, running, completed, failed]
      description: Status of a performance evaluation

    JobStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]
      description: Status of a background job

    JobType:
      type: string
      enum: [preview, evaluate, generate_predictions]
      description: Type of background job

    PredictionResult:
      type:
        - string
        - "null"
      enum: [win, loss, push, null]
      description: Result of a prediction (null if pending)

    PredictedSide:
      type: string
      enum: [home, away, over, under]
      description: Side the model predicted

    GameResult:
      type: string
      enum: [win, loss, push, pending]
      description: Result of a game prediction

    # Lab Factor Schemas
    FactorConfigParamType:
      type: string
      enum: [integer, boolean, string]

    FactorConfigParam:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/FactorConfigParamType"
        default:
          oneOf:
            - type: integer
            - type: boolean
            - type: string
          description: Default value for the parameter
        min:
          type: number
          description: Minimum value (for integer type)
        max:
          type: number
          description: Maximum value (for integer type)
        options:
          type: array
          items:
            type: string
          description: Available options (for string type)
        description:
          type: string
          description: Description of what the parameter controls

    Factor:
      type: object
      properties:
        id:
          type: integer
          description: Unique factor identifier
        slug:
          type: string
          description: URL-friendly factor identifier
        name:
          type: string
          description: Human-readable factor name
        description:
          type:
            - string
            - "null"
          description: Detailed description of the factor
        category:
          type: string
          description: Factor category (team_performance, matchup, situational, player, market)
        sport:
          type: string
          description: Sport this factor applies to
        output_type:
          type: string
          description: Type of output the factor produces
        raw_value_unit:
          type:
            - string
            - "null"
          description: Unit of measurement for raw values
        configurable_params:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/FactorConfigParam"
            - type: "null"
          description: Configurable parameters for this factor

    # Lab Model Schemas
    ImportanceMultipliers:
      type: object
      description: Custom importance multipliers for simple mode
      properties:
        low:
          type: number
          description: Weight multiplier for low importance factors
        medium:
          type: number
          description: Weight multiplier for medium importance factors
        high:
          type: number
          description: Weight multiplier for high importance factors

    BettingThresholds:
      type: object
      description: Custom thresholds for determining when to place bets
      properties:
        spread_score_diff:
          type: number
          description: Score difference threshold for spread bets
        over_under_combined:
          type: number
          description: Combined score threshold for over/under bets
        moneyline_score_diff:
          type: number
          description: Score difference threshold for moneyline bets

    AdvancedConfig:
      oneOf:
        - type: object
          description: Optional advanced configuration for model calculations
          properties:
            importance_multipliers:
              $ref: "#/components/schemas/ImportanceMultipliers"
            betting_thresholds:
              $ref: "#/components/schemas/BettingThresholds"
        - type: "null"

    ModelFactorInput:
      type: object
      required:
        - factor_id
      properties:
        factor_id:
          type: integer
          description: ID of the factor to include in the model
        importance:
          $ref: "#/components/schemas/Importance"
        weight:
          type: number
          minimum: 0
          maximum: 100
          description: Weight of this factor (0-100, must sum to 100 in weighted mode)
        parameters:
          type: object
          additionalProperties: true
          description: Custom parameters for this factor
        conditions:
          type: object
          additionalProperties: true
          description: Conditions for when this factor applies

    ModelFactor:
      type: object
      properties:
        factor_id:
          type: integer
          description: ID of the factor
        factor_slug:
          type: string
          description: URL-friendly factor identifier
        factor_name:
          type: string
          description: Human-readable factor name
        importance:
          oneOf:
            - $ref: "#/components/schemas/Importance"
            - type: "null"
        weight:
          type:
            - number
            - "null"
          description: Weight of this factor (0-100)
        parameters:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
          description: Custom parameters for this factor
        conditions:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
          description: Conditions for when this factor applies

    ModelSlim:
      type: object
      properties:
        id:
          type: integer
          description: Unique model identifier
        name:
          type: string
          description: Model name
        description:
          type:
            - string
            - "null"
          description: Model description
        sport:
          type: string
          description: Sport this model predicts
        bet_type:
          $ref: "#/components/schemas/BetType"
        prop_type:
          type:
            - string
            - "null"
          description: Specific prop type (for player_prop bet_type)
        mode:
          $ref: "#/components/schemas/ModelMode"
        advanced_config:
          $ref: "#/components/schemas/AdvancedConfig"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the model was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the model was last updated

    Model:
      allOf:
        - $ref: "#/components/schemas/ModelSlim"
        - type: object
          properties:
            factors:
              type: array
              items:
                $ref: "#/components/schemas/ModelFactor"
              description: Factors included in this model

    CreateModelRequest:
      type: object
      required:
        - name
        - bet_type
        - mode
        - factors
      properties:
        name:
          type: string
          description: Model name
        description:
          type: string
          description: Model description
        sport:
          $ref: "#/components/schemas/Sport"
        bet_type:
          $ref: "#/components/schemas/BetType"
        prop_type:
          type: string
          description: Specific prop type (for player_prop bet_type)
        mode:
          $ref: "#/components/schemas/ModelMode"
        factors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ModelFactorInput"
          description: Factors to include in the model

    UpdateModelRequest:
      type: object
      properties:
        name:
          type: string
          description: Model name
        description:
          type: string
          description: Model description
        bet_type:
          $ref: "#/components/schemas/BetType"
        prop_type:
          type: string
          description: Specific prop type (for player_prop bet_type)
        mode:
          $ref: "#/components/schemas/ModelMode"
        factors:
          type: array
          items:
            $ref: "#/components/schemas/ModelFactorInput"
          description: Factors to include in the model

    # Lab Performance Result Schemas
    ResultsByConfidence:
      type: object
      properties:
        bucket:
          type: string
          description: Confidence bucket range (e.g., "0.5-0.6")
        games:
          type: integer
          description: Number of games in this bucket
        wins:
          type: integer
          description: Number of wins
        losses:
          type: integer
          description: Number of losses
        pushes:
          type: integer
          description: Number of pushes
        win_rate:
          type: number
          description: Win rate as decimal
        roi:
          type: number
          description: Return on investment as decimal

    ResultsOverTime:
      type: object
      properties:
        date:
          type: string
          description: Date or period
        cumulative_wins:
          type: integer
          description: Cumulative wins up to this date
        cumulative_losses:
          type: integer
          description: Cumulative losses up to this date
        cumulative_roi:
          type: number
          description: Cumulative ROI up to this date

    # Lab Prediction Schemas
    TeamInfo:
      type: object
      properties:
        id:
          type: integer
          description: Team ID
        name:
          type: string
          description: Team name
        abbreviation:
          type: string
          description: Team abbreviation

    GameInfo:
      type: object
      properties:
        id:
          type: integer
          description: Game ID
        date:
          type: string
          format: date
          description: Game date (YYYY-MM-DD)
        home_team:
          $ref: "#/components/schemas/TeamInfo"
        visitor_team:
          $ref: "#/components/schemas/TeamInfo"
        home_team_score:
          type:
            - integer
            - "null"
          description: Home team final score (null if game not completed)
        visitor_team_score:
          type:
            - integer
            - "null"
          description: Visitor team final score (null if game not completed)
        status:
          type:
            - string
            - "null"
          description: Game status (e.g., "Final", "Scheduled")

    Prediction:
      type: object
      properties:
        id:
          type: integer
          description: Unique prediction identifier
        model_id:
          type: integer
          description: ID of the model that made this prediction
        game_id:
          type: integer
          description: ID of the game being predicted
        predicted_value:
          type:
            - number
            - "null"
          description: Predicted value
        confidence:
          type:
            - number
            - "null"
          description: Confidence level (0-1)
        market_value:
          type:
            - number
            - "null"
          description: Market line value at prediction time
        edge:
          type:
            - number
            - "null"
          description: Edge over market
        actual_value:
          type:
            - number
            - "null"
          description: Actual result value
        result:
          $ref: "#/components/schemas/PredictionResult"
        home_ml:
          type:
            - number
            - "null"
          description: Home team moneyline odds at prediction time
        away_ml:
          type:
            - number
            - "null"
          description: Away team moneyline odds at prediction time
        created_at:
          type: string
          format: date-time
          description: Timestamp when prediction was created
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when prediction was resolved

    PredictionWithGame:
      allOf:
        - $ref: "#/components/schemas/Prediction"
        - type: object
          properties:
            game:
              $ref: "#/components/schemas/GameInfo"

    PredictionStats:
      type: object
      properties:
        total:
          type: integer
          description: Total predictions
        wins:
          type: integer
          description: Number of wins
        losses:
          type: integer
          description: Number of losses
        pushes:
          type: integer
          description: Number of pushes
        win_rate:
          type: number
          description: Win rate as percentage

    # Lab Performance Schemas
    PerformanceTeamInfo:
      type: object
      properties:
        id:
          type: integer
          description: Team ID
        abbreviation:
          type: string
          description: Team abbreviation
        name:
          type: string
          description: Team name

    FactorValue:
      type: object
      properties:
        factor_slug:
          type: string
          description: Factor identifier
        raw_value:
          oneOf:
            - type: number
            - type: boolean
            - type: string
          description: Raw factor value
        score:
          type: number
          description: Normalized score (0-100)
        parameters:
          type: object
          additionalProperties: true
          description: Parameters used for calculation

    PerformanceGameResult:
      type: object
      properties:
        game_id:
          type: integer
          description: Game ID
        date:
          type: string
          format: date
          description: Game date (YYYY-MM-DD)
        home_team:
          $ref: "#/components/schemas/PerformanceTeamInfo"
        away_team:
          $ref: "#/components/schemas/PerformanceTeamInfo"
        home_score:
          type:
            - integer
            - "null"
          description: Home team score
        away_score:
          type:
            - integer
            - "null"
          description: Away team score
        market_value:
          type: number
          description: Market line value
        home_model_score:
          type: number
          description: Model's score for home team
        away_model_score:
          type: number
          description: Model's score for away team
        predicted_side:
          $ref: "#/components/schemas/PredictedSide"
        confidence:
          type: number
          description: Confidence level
        result:
          $ref: "#/components/schemas/GameResult"
        is_future:
          type: boolean
          description: Whether this is a future game (prediction only)
        factor_details:
          type: object
          properties:
            home:
              type: array
              items:
                $ref: "#/components/schemas/FactorValue"
            away:
              type: array
              items:
                $ref: "#/components/schemas/FactorValue"
          description: Detailed factor values for each team

    ModelPerformance:
      type: object
      properties:
        model_id:
          type: integer
          description: ID of the model
        status:
          $ref: "#/components/schemas/PerformanceStatus"
        error_message:
          type:
            - string
            - "null"
          description: Error message if status is failed
        evaluated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when evaluation completed
        games_evaluated:
          type:
            - integer
            - "null"
          description: Number of games evaluated
        date_range_start:
          type:
            - string
            - "null"
          format: date
          description: Start of evaluation date range (YYYY-MM-DD)
        date_range_end:
          type:
            - string
            - "null"
          format: date
          description: End of evaluation date range (YYYY-MM-DD)
        total_bets:
          type:
            - integer
            - "null"
          description: Total number of bets
        wins:
          type:
            - integer
            - "null"
          description: Number of wins
        losses:
          type:
            - integer
            - "null"
          description: Number of losses
        pushes:
          type:
            - integer
            - "null"
          description: Number of pushes
        win_rate:
          type:
            - number
            - "null"
          description: Win rate as decimal
        roi:
          type:
            - number
            - "null"
          description: Return on investment as decimal
        avg_confidence:
          type:
            - number
            - "null"
          description: Average confidence
        results_by_confidence:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ResultsByConfidence"
            - type: "null"
          description: Results by confidence bucket
        results_over_time:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ResultsOverTime"
            - type: "null"
          description: Results over time

    EvaluatePerformanceRequest:
      type: object
      properties:
        season:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: Season to evaluate (format "YYYY-YY", e.g., "2024-25"). Allowed range 2020-21 to 2025-26.

    PreviewFactorInput:
      type: object
      required:
        - factor_id
      properties:
        factor_id:
          type: integer
          description: ID of the factor
        importance:
          $ref: "#/components/schemas/Importance"
        weight:
          type: number
          minimum: 0
          maximum: 100
          description: Weight (0-100)
        parameters:
          type: object
          additionalProperties: true
          description: Factor parameters

    PreviewRequest:
      type: object
      required:
        - bet_type
        - mode
        - factors
      properties:
        bet_type:
          $ref: "#/components/schemas/BetType"
        mode:
          $ref: "#/components/schemas/ModelMode"
        sport:
          $ref: "#/components/schemas/Sport"
        advanced_config:
          $ref: "#/components/schemas/AdvancedConfig"
        factors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PreviewFactorInput"
          description: Factors for the preview
        start_season:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: Start season (format "YYYY-YY", e.g., "2023-24")
        end_season:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: End season (format "YYYY-YY", e.g., "2024-25")

    PreviewPrediction:
      type: object
      properties:
        game_id:
          type: integer
          description: Game ID
        date:
          type: string
          format: date
          description: Game date (YYYY-MM-DD)
        home_team:
          $ref: "#/components/schemas/PerformanceTeamInfo"
        away_team:
          $ref: "#/components/schemas/PerformanceTeamInfo"
        market_value:
          type: number
          description: Market line value
        predicted_side:
          $ref: "#/components/schemas/PredictedSide"
        confidence:
          type: number
          description: Confidence level
        home_model_score:
          type: number
          description: Model's score for home team
        away_model_score:
          type: number
          description: Model's score for away team

    PreviewOutput:
      type: object
      properties:
        historical:
          type: object
          properties:
            total_games:
              type: integer
              description: Total games evaluated
            wins:
              type: integer
              description: Number of wins
            losses:
              type: integer
              description: Number of losses
            pushes:
              type: integer
              description: Number of pushes
            win_rate:
              type: number
              description: Win rate as decimal
            roi:
              type: number
              description: ROI as decimal
            avg_confidence:
              type: number
              description: Average confidence
            results_by_confidence:
              type: array
              items:
                $ref: "#/components/schemas/ResultsByConfidence"
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/PreviewPrediction"
          description: Predictions for upcoming games

    # Lab Job Output Schemas
    EvaluateOutput:
      type: object
      description: Output for evaluate jobs
      properties:
        success:
          type: boolean
          description: Whether evaluation completed successfully

    GeneratePredictionsOutput:
      type: object
      description: Output for generate_predictions jobs
      properties:
        count:
          type: integer
          description: Number of predictions generated

    # Lab Job Schemas
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique job identifier (UUID)
        model_id:
          type:
            - integer
            - "null"
          description: ID of the associated model (null for preview jobs)
        job_type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        output:
          description: Job output (structure depends on job_type)
          oneOf:
            - $ref: "#/components/schemas/PreviewOutput"
            - $ref: "#/components/schemas/EvaluateOutput"
            - $ref: "#/components/schemas/GeneratePredictionsOutput"
            - type: "null"
        error_message:
          type:
            - string
            - "null"
          description: Error message if status is failed
        created_at:
          type: string
          format: date-time
          description: Timestamp when job was created
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when job started processing
        completed_at:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when job completed

  examples:
    # ============================================
    # Factor Examples
    # ============================================
    FactorTeamPerformance:
      summary: Team Performance Factor
      description: A factor that tracks team scoring average
      value:
        id: 1
        slug: team_last_n_pts_avg
        name: Team Last N Games Scoring Average
        description: Average points scored by team in their last N games. Higher scoring indicates stronger offense.
        category: team_performance
        sport: nba
        output_type: points
        raw_value_unit: points per game
        configurable_params:
          n_games:
            type: integer
            default: 10
            min: 3
            max: 30
            description: Number of recent games to average
          home_only:
            type: boolean
            default: false
            description: Only include home games
          away_only:
            type: boolean
            default: false
            description: Only include away games

    FactorMatchup:
      summary: Matchup Factor
      description: A factor that evaluates head-to-head history
      value:
        id: 6
        slug: head_to_head_record
        name: Head-to-Head Record
        description: Win percentage in recent matchups between the two teams. Historical dominance can persist.
        category: matchup
        sport: nba
        output_type: percentage
        raw_value_unit: win percentage
        configurable_params:
          n_games:
            type: integer
            default: 10
            min: 3
            max: 20
            description: Number of recent matchups to consider
          include_playoffs:
            type: boolean
            default: true
            description: Include playoff games in history

    FactorSituational:
      summary: Situational Factor
      description: A boolean factor for back-to-back games
      value:
        id: 11
        slug: back_to_back
        name: Back-to-Back Game
        description: Whether this is the second game of a back-to-back. B2B teams typically underperform.
        category: situational
        sport: nba
        output_type: boolean
        raw_value_unit: boolean
        configurable_params: {}

    FactorListResponse:
      summary: List of factors
      description: Response containing multiple factors filtered by category
      value:
        data:
          - id: 1
            slug: team_last_n_pts_avg
            name: Team Last N Games Scoring Average
            description: Average points scored by team in their last N games.
            category: team_performance
            sport: nba
            output_type: points
            raw_value_unit: points per game
            configurable_params:
              n_games:
                type: integer
                default: 10
                min: 3
                max: 30
                description: Number of recent games to average
          - id: 2
            slug: team_last_n_pts_allowed_avg
            name: Team Last N Games Points Allowed Average
            description: Average points allowed by team in their last N games.
            category: team_performance
            sport: nba
            output_type: points
